[project]
name = "aquariam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SANIC6", email = "somayajivar@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "logging>=0.4.9.6",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pylint>=4.0.8",
    "pytest>=9.1.1",
    "torch>=2.14.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.0",
]

[project.scripts]
aquariam = "aquariam:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
